name: Restrict pull requests

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-contributions:
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close outside pull request
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr close "$PR_NUMBER"
          --comment "Thanks for your interest. This repository accepts pull requests only from organization members, repository collaborators, and approved maintenance bots. Please start with a Discussion instead: https://github.com/mathematic-inc/connectrpc-sdk/discussions/new"
