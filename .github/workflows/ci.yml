name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Proves the package builds from a clean checkout, which the tests do not.
      - run: npm run build
      - name: Verify package
        run: npm pack --dry-run --workspace protoc-gen-connect-sdk
      - name: Audit dependencies
        run: npm audit --audit-level high

  proto:
    name: Lint protos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml pins buf, so CI and local runs cannot disagree.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: npm ci
      - run: buf lint
      - run: buf format --diff --exit-code
      # The annotations' bindings are committed, so a stale copy is a bug.
      - name: Check generated bindings are current
        run: |
          buf generate
          git diff --exit-code -- packages/protoc-gen-connect-sdk/src/gen
