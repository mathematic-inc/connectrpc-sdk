name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node npm
      - name: Verify lockfile is current
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Proves the package builds from a clean checkout, which the tests do not.
      - run: npm run build
      - name: Verify package
        run: npm pack --dry-run --workspace protoc-gen-connect-sdk
      - name: Audit dependencies
        run: npm audit --audit-level high

  proto:
    name: Lint protos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml pins buf, so CI and local runs cannot disagree.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: npm ci
      - run: buf lint
      - run: buf format --diff --exit-code
      # The annotations' bindings are committed, so a stale copy is a bug.
      - name: Check generated bindings are current
        run: |
          buf generate
          git diff --exit-code -- packages/protoc-gen-connect-sdk/src/gen
