syntax = "proto3";

package connectsdk.v1;

import "google/protobuf/descriptor.proto";

// Overrides for the names an SDK generator derives from a schema.
//
// A generator reads a service and its methods and produces a namespaced
// client: `WorkspaceService.CreateWorkspace` becomes `workspaces.create`,
// because the namespace already says "workspace" and repeating it would read
// as `workspaces.createWorkspace`.
//
// That derivation follows the schema's own naming, which is occasionally not
// the naming its callers want. These options are how a schema corrects it.
// Set one only where the derived name is wrong, since a redundant override is
// a second place to change a name.
extend google.protobuf.ServiceOptions {
  // Namespace this service's methods are grouped under.
  //
  // Defaults to the lower-camel plural of the service name with its `Service`
  // suffix removed, so `WorkspaceService` becomes `workspaces`.
  //
  // Irregular plurals are handled, so `PersonService` gives `people` without
  // an override. Set this where the resource a schema names is not the one
  // its callers know:
  //
  //     service WorkspaceService {
  //       option (connectsdk.v1.namespace) = "projects";
  //     }
  //
  // Two services may share a namespace, which is how a schema splits one
  // client-facing surface across several services.
  string namespace = 7401;
}

extend google.protobuf.MethodOptions {
  // Name this method takes within its namespace.
  //
  // Defaults to the method name with the resource its namespace already names
  // removed: `ListWorkspaces` becomes `list`, while `SetDraftMode` keeps every
  // word because it names no resource to remove.
  //
  // Set it where removing the resource leaves the wrong word:
  //
  //     rpc ListEntityExports(ListEntityExportsRequest) returns (ListEntityExportsResponse) {
  //       option (connectsdk.v1.method) = "listForEntity";
  //     }
  //
  // Written in lower camel case whatever the target language. Generators
  // convert it to their own convention, so one override serves all of them.
  string method = 7401;
}
